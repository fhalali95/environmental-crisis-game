<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crisis Control | Environmental Sustainability</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;--bg:#091b23;--panel:#122d36;--line:#31505a;--ink:#f0faf9;--mut:#aac5ca;--mint:#65e0bd;--gold:#ffd47c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#174a51,transparent 42%),var(--bg);color:var(--ink)}main{max-width:850px;margin:auto;padding:24px 16px 70px}.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mint);font-weight:800}.hero{padding:28px 0 12px}h1{font-size:clamp(32px,6vw,55px);line-height:1.06;margin:10px 0}h2{margin:0 0 12px;font-size:24px}p{color:var(--mut);line-height:1.6}.panel{background:rgba(18,45,54,.94);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 14px 35px #0002}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid var(--line);border-radius:14px;padding:12px}.stat small{display:block;color:var(--mut)}.stat strong{font-size:21px}.btn{border:0;border-radius:13px;padding:13px 18px;background:var(--mint);color:#092a30;font-weight:800;font-size:16px;cursor:pointer}.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn:disabled{opacity:.35;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.choice{display:block;width:100%;text-align:left;background:#193842;border:2px solid var(--line);color:var(--ink);border-radius:14px;padding:16px;margin:10px 0;cursor:pointer;font:inherit}.choice.selected{border-color:var(--mint);background:#1d4e50}.choice:disabled{opacity:.45;cursor:not-allowed}.choice .cost{float:right;color:var(--gold);font-weight:800;margin-left:8px}.progress{height:9px;border-radius:10px;background:#28444c;overflow:hidden}.progress span{display:block;height:100%;background:var(--mint)}.hint{font-size:13px;color:var(--mut)}.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.impact div{padding:12px;border-radius:12px;background:#1c4047;text-align:center}.impact b{display:block;font-size:24px}.good{color:var(--mint)}.bad{color:#ff9b8c}.review{border-left:3px solid var(--mint);padding:10px 14px;margin:12px 0;background:#1b3b42;border-radius:0 12px 12px 0}.review p{margin:5px 0}.tag{color:var(--gold);font-size:13px;font-weight:800}.emoji{font-size:56px}.muted{color:var(--mut)}footer{font-size:12px;color:var(--mut);margin-top:26px}@media(max-width:480px){.panel{padding:17px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:8px}.stat strong{font-size:17px}.impact{grid-template-columns:1fr 1fr 1fr}.impact div{padding:8px}}@media print{body{background:white;color:black}.panel{background:white;color:black;border:1px solid #aaa;box-shadow:none}p,.muted{color:#333}.actions,.btn{display:none!important}}
</style></head><body><main><div class="brand">SUST101 · Environmental Sustainability</div><div id="app"></div><footer>Educational simulation · Fictional scenarios and simplified impact scores, not official course assessment.</footer></main><script>
const DATA=[{"title": "Water Contamination", "desc": "Industrial wastewater has entered the city water supply. Residents report unusual odors.", "emoji": "💧", "options": [{"text": "Stop discharge, warn residents, and supply safe water", "cost": 420, "env": 3, "eco": -1, "soc": 3, "why": "Immediate protection and source control work together."}, {"text": "Test samples and publish a monitoring dashboard", "cost": 160, "env": 1, "eco": 0, "soc": 1, "why": "Monitoring is valuable but cannot stop exposure alone."}, {"text": "Build a new treatment plant as the only response", "cost": 850, "env": 2, "eco": -2, "soc": 0, "why": "Long-term infrastructure cannot replace emergency measures."}, {"text": "Wait for complaints to increase", "cost": 0, "env": -3, "eco": 0, "soc": -3, "why": "Delay puts residents at risk."}]}, {"title": "Air Quality Emergency", "desc": "Traffic and factory emissions have pushed air pollution to dangerous levels.", "emoji": "🌫️", "options": [{"text": "Enforce temporary emissions controls and health alerts", "cost": 300, "env": 3, "eco": -1, "soc": 3, "why": "Combines pollution reduction with immediate public protection."}, {"text": "Expand clean buses and safe cycling routes", "cost": 530, "env": 2, "eco": 1, "soc": 2, "why": "A strong longer-term measure, but it takes time."}, {"text": "Install air sensors without reducing emissions", "cost": 130, "env": 1, "eco": 0, "soc": 1, "why": "Measurements help decisions but do not remove pollution."}, {"text": "Ignore the warning to avoid economic losses", "cost": 0, "env": -3, "eco": 1, "soc": -3, "why": "Short-term savings do not justify health damage."}]}, {"title": "Waste Overflow", "desc": "Neighborhood bins are overflowing and the landfill is nearly full.", "emoji": "♻️", "options": [{"text": "Organize collection, separation, and recycling", "cost": 390, "env": 3, "eco": 1, "soc": 2, "why": "Reduces waste accumulation and recovers useful materials."}, {"text": "Run food-waste prevention and composting pilots", "cost": 260, "env": 2, "eco": 1, "soc": 2, "why": "Prevents organic waste and reduces landfill demand."}, {"text": "Construct another landfill without reducing waste", "cost": 760, "env": 0, "eco": -1, "soc": 0, "why": "More space does not solve waste generation."}, {"text": "Burn rubbish outdoors", "cost": 0, "env": -3, "eco": -2, "soc": -3, "why": "Open burning releases hazardous pollution."}]}, {"title": "Urban Heatwave", "desc": "A prolonged heatwave threatens older residents and outdoor workers.", "emoji": "🌡️", "options": [{"text": "Open cooling centers, issue alerts, and protect workers", "cost": 320, "env": 2, "eco": -1, "soc": 3, "why": "Immediate measures protect vulnerable people."}, {"text": "Add shade, cool roofs, and climate-resilient streets", "cost": 500, "env": 3, "eco": 0, "soc": 2, "why": "Urban design can reduce heat exposure over time."}, {"text": "Use only a social media hashtag", "cost": 50, "env": 0, "eco": 0, "soc": 0, "why": "Awareness without practical protection is insufficient."}, {"text": "Cancel all water deliveries to save funds", "cost": 0, "env": -2, "eco": 1, "soc": -3, "why": "This increases risks during extreme heat."}]}, {"title": "Coastal Flooding", "desc": "A severe storm threatens homes and essential infrastructure near the coast.", "emoji": "🌊", "options": [{"text": "Evacuate high-risk areas and protect essential services", "cost": 440, "env": 2, "eco": -1, "soc": 3, "why": "Life safety and continuity are immediate priorities."}, {"text": "Restore coastal habitats and improve drainage", "cost": 470, "env": 3, "eco": 0, "soc": 2, "why": "Nature-based and drainage measures support resilience."}, {"text": "Build a seawall without assessing local impacts", "cost": 800, "env": 0, "eco": -2, "soc": 0, "why": "Single measures can shift risk or harm habitats."}, {"text": "Wait until roads are submerged", "cost": 0, "env": -3, "eco": 0, "soc": -3, "why": "Late response reduces evacuation options."}]}, {"title": "Energy Shortage", "desc": "Electricity demand is rising and the city relies heavily on fossil fuels.", "emoji": "⚡", "options": [{"text": "Improve building efficiency and demand management", "cost": 350, "env": 3, "eco": 2, "soc": 2, "why": "Efficiency reduces energy use and costs."}, {"text": "Invest in renewable power with grid planning", "cost": 580, "env": 3, "eco": 1, "soc": 2, "why": "Clean generation helps, with proper integration."}, {"text": "Keep inefficient systems unchanged", "cost": 0, "env": -2, "eco": 0, "soc": -1, "why": "Avoiding action prolongs waste and emissions."}, {"text": "Turn off hospital electricity to cut demand", "cost": 0, "env": -2, "eco": 1, "soc": -3, "why": "Critical services must be protected."}]}];const KEY='crisis-control-sust101-v2';const BUDGET=1000;let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Number.isInteger(state.stage)||state.stage<0||state.stage>DATA.length||!Array.isArray(state.results))state={stage:0,results:[],selection:[],screen:'home'};const app=document.getElementById('app');function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function money(n){return 'AED '+n.toLocaleString('en-US')+'k'}function btn(label,fn,secondary=false){const b=document.createElement('button');b.className='btn'+(secondary?' secondary':'');b.textContent=label;b.onclick=fn;return b}function node(tag,cls,text){let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function add(parent,...children){children.forEach(x=>parent.append(x));return parent}function panel(){return node('section','panel')}function reset(){state={stage:0,results:[],selection:[],screen:'home'};save();render()}function intro(){let h=node('div','hero');add(h,node('div','emoji','🏙️'),node('h1','', 'CRISIS CONTROL'),node('p','','SAVE THE CITY · Six environmental emergencies. Make the decisions that protect people, nature, and public resources.'));app.append(h);let p=panel();add(p,node('h2','','You are the city sustainability leader'),node('p','','For each crisis, select exactly TWO actions. You have AED 1,000k per crisis. Your choices affect Environment, Economy and Society. Unspent money counts, but protecting the city matters more.'));let s=node('div','stats');[['6','Crisis rounds'],['2','Choices per round'],['1,000k','Budget per round']].forEach(x=>{let z=node('div','stat');add(z,node('strong','',x[0]),node('small','',x[1]));s.append(z)});p.append(s);let a=node('div','actions');a.append(btn(state.stage>0?'Continue saved game':'Start mission',()=>{state.screen='play';save();render()}));a.append(btn('Start fresh',()=>{if(confirm('Erase saved progress and restart?'))reset()},true));p.append(a);app.append(p)}function current(){return DATA[state.stage]}function play(){if(state.stage>=DATA.length){state.screen='final';save();return render()}let d=current(),selected=state.selection||[],used=selected.reduce((s,k)=>s+d.options[k].cost,0);let top=panel();add(top,node('div','tag',`CRISIS ${state.stage+1} OF ${DATA.length}`),node('div','emoji',d.emoji),node('h2','',d.title),node('p','',d.desc));let stats=node('div','stats');[['Budget',money(BUDGET)],['Selected',selected.length+'/2'],['Remaining',money(BUDGET-used)]].forEach(x=>{let z=node('div','stat');add(z,node('small','',x[0]),node('strong','',x[1]));stats.append(z)});top.append(stats);let bar=node('div','progress');bar.style.marginTop='14px';let fill=node('span');fill.style.width=Math.max(0,Math.min(100,used/BUDGET*100))+'%';bar.append(fill);top.append(bar);app.append(top);let p=panel();add(p,node('h2','','Choose two actions'),node('p','hint','Tap a selected action again to remove it.'));d.options.forEach((o,i)=>{let b=node('button','choice'+(selected.includes(i)?' selected':''));let cost=node('span','cost',money(o.cost));b.append(cost,document.createTextNode(o.text));b.disabled=!selected.includes(i)&&selected.length===2;b.onclick=()=>{let k=state.selection.indexOf(i);if(k>=0)state.selection.splice(k,1);else state.selection.push(i);save();render()};p.append(b)});let a=node('div','actions');let submit=btn('Confirm decisions →',()=>{if(state.selection.length!==2)return;let picks=state.selection.map(i=>d.options[i]);let impact=picks.reduce((v,o)=>({env:v.env+o.env,eco:v.eco+o.eco,soc:v.soc+o.soc}),{env:0,eco:0,soc:0});let spent=picks.reduce((s,o)=>s+o.cost,0);let quality=impact.env*3+impact.soc*3+impact.eco;state.results.push({title:d.title,picks:state.selection.slice(),impact,spent,quality});state.selection=[];state.screen='feedback';save();render()});submit.disabled=selected.length!==2||used>BUDGET;a.append(submit);a.append(btn('Main menu',()=>{state.screen='home';save();render()},true));p.append(a);app.append(p)}function impacts(i){let g=node('div','impact');[['🌿 Environment',i.env],['💼 Economy',i.eco],['🤝 Society',i.soc]].forEach(x=>{let z=node('div');add(z,node('small','',x[0]),node('b',x[1]>=0?'good':'bad',(x[1]>0?'+':'')+x[1]));g.append(z)});return g}function feedback(){let r=state.results[state.stage],d=current();if(!r){state.screen='play';return render()}let p=panel();add(p,node('div','tag',`ROUND ${state.stage+1} RESULTS`),node('h2','',d.title),node('p','','Every decision has trade-offs. Here is what your choices mean:'));r.picks.forEach(i=>{let o=d.options[i],x=node('div','review');add(x,node('strong','',o.text),node('p','',o.why));p.append(x)});add(p,node('h2','','Your impact'),impacts(r.impact));let s=node('div','stats');[['Spent',money(r.spent)],['Unspent',money(BUDGET-r.spent)],['Decision score',String(r.quality)]].forEach(x=>{let z=node('div','stat');add(z,node('small','',x[0]),node('strong','',x[1]));s.append(z)});p.append(s);let a=node('div','actions');a.append(btn(state.stage===DATA.length-1?'View final results →':'Next crisis →',()=>{state.stage++;state.screen=state.stage>=DATA.length?'final':'play';save();render()}));p.append(a);app.append(p)}function summary(){let totals=state.results.reduce((v,r)=>({env:v.env+r.impact.env,eco:v.eco+r.impact.eco,soc:v.soc+r.impact.soc}),{env:0,eco:0,soc:0});let saved=state.results.reduce((s,r)=>s+BUDGET-r.spent,0);let score=state.results.reduce((s,r)=>s+r.quality,0);let p=panel();add(p,node('div','emoji','🏆'),node('h1','','MISSION COMPLETE'),node('p','',score>=55&&totals.env>=0&&totals.soc>=0?'Excellent leadership! You balanced urgent protection with sustainability.':score>=25&&totals.env>=0&&totals.soc>=0?'Good progress. Review the trade-offs and try for a stronger result.':'Your city needs a stronger response. Replay to protect people and the environment.'));let s=node('div','stats');[['Unspent funds',money(saved)],['Decision score',String(score)],['Crises solved',state.results.length+'/6']].forEach(x=>{let z=node('div','stat');add(z,node('small','',x[0]),node('strong','',x[1]));s.append(z)});p.append(s,node('h2','','Overall sustainability impact'),impacts(totals));state.results.forEach((r,k)=>{let x=node('div','review');add(x,node('strong','',`${k+1}. ${r.title}`),node('p','',`Spent: ${money(r.spent)} · Decision score: ${r.quality}`));p.append(x)});let a=node('div','actions');a.append(btn('Download results (.txt)',()=>{let lines=['CRISIS CONTROL — SUST101','Educational simulation',`Unspent funds: ${money(saved)}`,`Decision score: ${score}`,`Environment: ${totals.env}, Economy: ${totals.eco}, Society: ${totals.soc}`,''];state.results.forEach((r,k)=>{lines.push(`${k+1}. ${r.title}`,`Spent: ${money(r.spent)}`,`Selected actions:`);r.picks.forEach(i=>lines.push('- '+DATA[k].options[i].text));lines.push('')});let blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});let url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='Crisis_Control_Results.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}));a.append(btn('Print / Save PDF',()=>window.print(),true));a.append(btn('Play again',()=>{if(confirm('Restart all six crises?'))reset()},true));p.append(a);app.append(p)}function render(){app.replaceChildren();if(state.screen==='home')intro();else if(state.screen==='feedback')feedback();else if(state.screen==='final')summary();else play()}render();
</script></body></html>
