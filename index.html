<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRISIS CONTROL | Sustainable City</title><style>

:root{color-scheme:dark;--bg:#06151b;--panel:#0d242b;--panel2:#123039;--line:#27505a;--mint:#55e1c4;--ink:#f0fbf8;--mut:#9db9bb;--gold:#e9c57a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#17484d 0%,#06151b 62%);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.wrap{max-width:1080px;margin:auto;padding:24px 18px 64px}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{font:900 18px Manrope;letter-spacing:2px}.brand b{color:var(--mint)}.pill{border:1px solid var(--line);padding:8px 13px;border-radius:99px;color:var(--mut);font-size:12px;letter-spacing:1px}.eyebrow{color:var(--mint);font-weight:800;letter-spacing:2.5px;text-transform:uppercase;font-size:11px}.hero{text-align:center;padding:10px 0 12px}.hero h1{font:900 clamp(35px,6vw,66px)/1.04 Manrope;margin:12px 0}.hero h1 em{color:var(--mint);font-style:normal}.hero p{color:var(--mut);max-width:570px;margin:0 auto 22px;line-height:1.7}.panel{background:linear-gradient(155deg,rgba(22,56,63,.98),rgba(9,29,36,.98));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 18px 65px #0002}.citypanel{padding:12px;position:relative;overflow:hidden}.city-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 12px;gap:10px;flex-wrap:wrap}.city-title{font:800 14px Manrope;letter-spacing:1px}.level{font-size:12px;color:var(--mint)}.citysvg{width:100%;height:auto;display:block;border-radius:14px;background:#0b2933}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stat{background:#0b252c;border:1px solid var(--line);border-radius:14px;padding:13px}.stat small{display:block;color:var(--mut);font-size:11px;margin-bottom:5px}.stat strong{font:800 clamp(16px,3vw,25px) Manrope}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;margin-top:18px}.sectiontitle{font:800 26px Manrope;margin:7px 0 10px}.desc{color:#c0d3d3;line-height:1.65}.options{display:grid;gap:10px;margin:18px 0}.option{background:#0b2730;border:1px solid #30515a;color:var(--ink);border-radius:13px;padding:15px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px}.option:hover{border-color:#69a9a7}.option.selected{border:2px solid var(--mint);background:#123f43}.option:disabled{opacity:.46}.option .price{white-space:nowrap;color:var(--gold);font-weight:800}.btn{background:linear-gradient(105deg,#55e1c4,#32b9aa);color:#052326;border:0;border-radius:13px;padding:15px 24px;font-weight:900;min-height:50px}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.secondary{background:#15343b;color:var(--ink);border:1px solid var(--line)}.actions{display:flex;gap:10px;flex-wrap:wrap}.progress{height:9px;background:#20444b;border-radius:30px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#2caa9b,#6df2d0);transition:width .5s}.mini{font-size:12px;color:var(--mut)}.score{font:900 44px Manrope;color:var(--mint)}.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.impact>div{padding:12px;background:#102f37;border-radius:12px;text-align:center}.impact strong{display:block;font:800 25px Manrope}.feedback{border-top:1px solid var(--line);padding:14px 0}.feedback b{color:var(--mint)}.footer{text-align:center;color:#65888b;font-size:11px;margin-top:25px}.hidden{display:none!important}@media(max-width:740px){.grid{grid-template-columns:1fr}.wrap{padding:16px 12px 40px}.panel{padding:16px}.citypanel{padding:8px}.hero h1{font-size:38px}.stats{gap:6px}.stat{padding:10px}.pill{font-size:10px}}

</style></head><body><div class="wrap"><header class="nav"><div class="brand">◈ CRISIS <b>CONTROL</b></div><div class="pill">ENVIRONMENTAL SUSTAINABILITY</div></header><main id="app"></main><div class="footer">A university learning simulation · Decisions and outcomes are illustrative, not real-world forecasts.</div></div><script>
const DATA=[{"title": "Water Contamination", "desc": "Industrial wastewater has entered the city water supply. Residents report unusual odors.", "emoji": "💧", "options": [{"text": "Stop discharge, warn residents, and supply safe water", "cost": 420, "env": 3, "eco": -1, "soc": 3, "why": "Immediate protection and source control work together."}, {"text": "Test samples and publish a monitoring dashboard", "cost": 160, "env": 1, "eco": 0, "soc": 1, "why": "Monitoring is valuable but cannot stop exposure alone."}, {"text": "Build a new treatment plant as the only response", "cost": 850, "env": 2, "eco": -2, "soc": 0, "why": "Long-term infrastructure cannot replace emergency measures."}, {"text": "Wait for complaints to increase", "cost": 0, "env": -3, "eco": 0, "soc": -3, "why": "Delay puts residents at risk."}]}, {"title": "Air Quality Emergency", "desc": "Traffic and factory emissions have pushed air pollution to dangerous levels.", "emoji": "🌫️", "options": [{"text": "Enforce temporary emissions controls and health alerts", "cost": 300, "env": 3, "eco": -1, "soc": 3, "why": "Combines pollution reduction with immediate public protection."}, {"text": "Expand clean buses and safe cycling routes", "cost": 530, "env": 2, "eco": 1, "soc": 2, "why": "A strong longer-term measure, but it takes time."}, {"text": "Install air sensors without reducing emissions", "cost": 130, "env": 1, "eco": 0, "soc": 1, "why": "Measurements help decisions but do not remove pollution."}, {"text": "Ignore the warning to avoid economic losses", "cost": 0, "env": -3, "eco": 1, "soc": -3, "why": "Short-term savings do not justify health damage."}]}, {"title": "Waste Overflow", "desc": "Neighborhood bins are overflowing and the landfill is nearly full.", "emoji": "♻️", "options": [{"text": "Organize collection, separation, and recycling", "cost": 390, "env": 3, "eco": 1, "soc": 2, "why": "Reduces waste accumulation and recovers useful materials."}, {"text": "Run food-waste prevention and composting pilots", "cost": 260, "env": 2, "eco": 1, "soc": 2, "why": "Prevents organic waste and reduces landfill demand."}, {"text": "Construct another landfill without reducing waste", "cost": 760, "env": 0, "eco": -1, "soc": 0, "why": "More space does not solve waste generation."}, {"text": "Burn rubbish outdoors", "cost": 0, "env": -3, "eco": -2, "soc": -3, "why": "Open burning releases hazardous pollution."}]}, {"title": "Urban Heatwave", "desc": "A prolonged heatwave threatens older residents and outdoor workers.", "emoji": "🌡️", "options": [{"text": "Open cooling centers, issue alerts, and protect workers", "cost": 320, "env": 2, "eco": -1, "soc": 3, "why": "Immediate measures protect vulnerable people."}, {"text": "Add shade, cool roofs, and climate-resilient streets", "cost": 500, "env": 3, "eco": 0, "soc": 2, "why": "Urban design can reduce heat exposure over time."}, {"text": "Use only a social media hashtag", "cost": 50, "env": 0, "eco": 0, "soc": 0, "why": "Awareness without practical protection is insufficient."}, {"text": "Cancel all water deliveries to save funds", "cost": 0, "env": -2, "eco": 1, "soc": -3, "why": "This increases risks during extreme heat."}]}, {"title": "Coastal Flooding", "desc": "A severe storm threatens homes and essential infrastructure near the coast.", "emoji": "🌊", "options": [{"text": "Evacuate high-risk areas and protect essential services", "cost": 440, "env": 2, "eco": -1, "soc": 3, "why": "Life safety and continuity are immediate priorities."}, {"text": "Restore coastal habitats and improve drainage", "cost": 470, "env": 3, "eco": 0, "soc": 2, "why": "Nature-based and drainage measures support resilience."}, {"text": "Build a seawall without assessing local impacts", "cost": 800, "env": 0, "eco": -2, "soc": 0, "why": "Single measures can shift risk or harm habitats."}, {"text": "Wait until roads are submerged", "cost": 0, "env": -3, "eco": 0, "soc": -3, "why": "Late response reduces evacuation options."}]}, {"title": "Energy Shortage", "desc": "Electricity demand is rising and the city relies heavily on fossil fuels.", "emoji": "⚡", "options": [{"text": "Improve building efficiency and demand management", "cost": 350, "env": 3, "eco": 2, "soc": 2, "why": "Efficiency reduces energy use and costs."}, {"text": "Invest in renewable power with grid planning", "cost": 580, "env": 3, "eco": 1, "soc": 2, "why": "Clean generation helps, with proper integration."}, {"text": "Keep inefficient systems unchanged", "cost": 0, "env": -2, "eco": 0, "soc": -1, "why": "Avoiding action prolongs waste and emissions."}, {"text": "Turn off hospital electricity to cut demand", "cost": 0, "env": -2, "eco": 1, "soc": -3, "why": "Critical services must be protected."}]}];
const KEY='crisis-control-evolved-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.history)||typeof state.step!=='number')state={step:-1,history:[],env:0,eco:0,soc:0,spent:0};const app=document.getElementById('app');const money=n=>'AED '+n.toLocaleString('en-US')+'k';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const reset=()=>{state={step:-1,history:[],env:0,eco:0,soc:0,spent:0};save();render()};const goodCount=()=>state.history.filter(x=>x.positive).length;const stage=()=>Math.max(0,Math.min(6,goodCount()));
function citySVG(){const lv=stage(),clean=lv>=1,air=lv>=2,waste=lv>=3,green=lv>=4,flood=lv>=5,energy=lv>=6;let buildings='';const arr=[[100,210,82],[205,168,126],[320,228,72],[435,152,142],[552,192,102],[660,217,77],[757,175,119]];arr.slice(0,Math.min(7,3+lv)).forEach(([x,y,h],i)=>{const c=['#285968','#32717a','#356c74','#3b7980'][i%4];buildings+=`<g><path d="M${x} ${y}l34 -21h66l-34 21z" fill="#5b9294"/><path d="M${x+66} ${y}l34 -21v${h}l-34 21z" fill="#1c4954"/><rect x="${x}" y="${y}" width="66" height="${h}" fill="${c}"/>${Array.from({length:Math.floor(h/21)},(_,r)=>Array.from({length:3},(_,col)=>`<rect x="${x+10+col*18}" y="${y+12+r*21}" width="9" height="11" rx="1" fill="${energy?'#baf3d6':'#9dc3c0'}" opacity=".85"/>`).join('')).join('')}${energy?`<path d="M${x+8} ${y-5}l34 -19h36l-34 19z" fill="#193e6a" stroke="#73d9e5" stroke-width="2"/>`:''}</g>`});let trees='';if(green)for(let k=0;k<14;k++){const x=55+k*57,y=325+(k%3)*15;trees+=`<g><rect x="${x}" y="${y}" width="5" height="22" fill="#72573d"/><circle cx="${x+2}" cy="${y-5}" r="13" fill="${k%2?'#46bb83':'#258a70'}"/></g>`}return `<svg class="citysvg" viewBox="0 0 900 440" role="img" aria-label="Isometric city model that becomes cleaner and larger after effective environmental decisions"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="${air?'#356f83':'#294650'}"/><stop offset="1" stop-color="#102f39"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="${clean?'#51d8cf':'#777e5a'}"/><stop offset="1" stop-color="${clean?'#237f9e':'#565c43'}"/></linearGradient></defs><rect width="900" height="440" fill="url(#sky)"/><circle cx="730" cy="68" r="42" fill="#d5e7b5" opacity=".25"/><path d="M0 205L210 116L440 204L680 110L900 220V440H0" fill="#20424a" opacity=".6"/><path d="M0 310L450 175L900 315L450 440Z" fill="#2a5960" stroke="#57878b" stroke-width="2"/><path d="M0 362L450 224L900 363" fill="none" stroke="#668e90" stroke-width="36"/><path d="M0 362L450 224L900 363" fill="none" stroke="#b4c3ae" stroke-width="2" stroke-dasharray="14 16"/><path d="M0 394Q200 340 420 398T900 388V440H0" fill="url(#water)"/><path d="M0 394Q200 340 420 398T900 388" fill="none" stroke="${clean?'#a5f5e7':'#aaa879'}" stroke-width="5" opacity=".6"/>${buildings}${trees}${waste?'':`<g><path d="M40 320l25 -17 20 20 -25 12z" fill="#a77c5c"/><path d="M770 340l30 -20 26 26 -32 13z" fill="#7b665b"/></g>`}${air?'':`<g fill="#8d9a96" opacity=".42"><circle cx="240" cy="95" r="44"/><circle cx="270" cy="65" r="49"/><circle cx="420" cy="65" r="55"/></g>`}${flood?'<path d="M25 384q90 -28 180 0t180 0" stroke="#91e9d4" stroke-width="5" fill="none"/>':''}<rect x="18" y="16" width="177" height="35" rx="17" fill="#071d25" opacity=".85"/><text x="36" y="39" font-family="sans-serif" font-size="15" font-weight="700" fill="#79e6d0">CITY LEVEL ${lv}/6</text></svg>`}
function cityPanel(){return `<section class="panel citypanel"><div class="city-head"><div class="city-title">◉ LIVE CITY EVOLUTION</div><span class="level">${stage()===6?'SUSTAINABLE CITY ACHIEVED':stage()===0?'CITY NEEDS YOUR HELP':'CITY RECOVERING · LEVEL '+stage()}</span></div>${citySVG()}<div style="padding:13px 10px 5px"><div style="display:flex;justify-content:space-between;margin-bottom:7px"><span class="mini">SUSTAINABILITY PROGRESS</span><span class="mini">${stage()} / 6 milestones</span></div><div class="progress"><span style="width:${stage()/6*100}%"></span></div></div></section>`}
function stats(){return `<div class="stats"><div class="stat"><small>ENVIRONMENT</small><strong>${state.env>=0?'+':''}${state.env}</strong></div><div class="stat"><small>SOCIETY</small><strong>${state.soc>=0?'+':''}${state.soc}</strong></div><div class="stat"><small>BUDGET SPENT</small><strong>${money(state.spent)}</strong></div></div>`}
function render(){if(state.step===-1){app.innerHTML=`<section class="hero"><div class="eyebrow">THE FUTURE IS YOUR DECISION</div><h1>Build a <em>Better City.</em></h1><p>Six environmental emergencies. One city to protect. Choose effective responses and watch your city transform from polluted streets into a thriving sustainable skyline.</p></section>${cityPanel()}<div style="text-align:center;margin:22px 0"><button class="btn" id="start">START YOUR MISSION →</button></div><div class="stats"><div class="stat"><small>MISSIONS</small><strong>06</strong></div><div class="stat"><small>DECISIONS</small><strong>12</strong></div><div class="stat"><small>PER-CRISIS BUDGET</small><strong>AED 1M</strong></div></div>`;document.getElementById('start').onclick=()=>{state.step=0;save();render()};return}if(state.step>=DATA.length){finish();return}const c=DATA[state.step];let selected=[];app.innerHTML=`<div class="eyebrow">MISSION ${String(state.step+1).padStart(2,'0')} / 06</div><h2 class="sectiontitle">${c.emoji} ${c.title}</h2><div class="grid"><div>${cityPanel()}${stats()}</div><section class="panel"><div class="eyebrow">YOUR DECISION MATTERS</div><h2 class="sectiontitle">The Crisis</h2><p class="desc">${c.desc}</p><div class="mini">SELECT EXACTLY TWO RESPONSES · MAXIMUM AED 1,000k</div><div class="options" id="opts"></div><div class="mini" id="budget"></div><div class="progress" style="margin:8px 0 17px"><span id="budgetbar" style="width:0%"></span></div><button class="btn" id="submit" disabled>CONFIRM DECISIONS →</button></section></div>`;const opts=document.getElementById('opts');function update(){let cost=selected.reduce((s,k)=>s+c.options[k].cost,0);opts.innerHTML=c.options.map((o,k)=>`<button class="option ${selected.includes(k)?'selected':''}" data-id="${k}" ${selected.length===2&&!selected.includes(k)?'disabled':''}><span>${selected.includes(k)?'✓ ':''}${o.text}</span><span class="price">${o.cost}k</span></button>`).join('');opts.querySelectorAll('button').forEach(b=>b.onclick=()=>{let k=Number(b.dataset.id);selected=selected.includes(k)?selected.filter(v=>v!==k):[...selected,k];update()});document.getElementById('budget').textContent=`Selected: ${selected.length}/2 · ${money(cost)} / AED 1,000k`;document.getElementById('budgetbar').style.width=Math.min(100,cost/10)+'%';document.getElementById('submit').disabled=selected.length!==2||cost>1000}update();document.getElementById('submit').onclick=()=>{let chosen=selected.map(k=>c.options[k]),cost=chosen.reduce((s,o)=>s+o.cost,0),env=chosen.reduce((s,o)=>s+o.env,0),eco=chosen.reduce((s,o)=>s+o.eco,0),soc=chosen.reduce((s,o)=>s+o.soc,0);let positive=env>=3&&soc>=1;state.env+=env;state.eco+=eco;state.soc+=soc;state.spent+=cost;state.history.push({title:c.title,chosen,env,eco,soc,cost,positive});state.step++;save();result()}}
function result(){const h=state.history.at(-1);app.innerHTML=`<div class="hero"><div class="eyebrow">MISSION ${state.history.length} COMPLETE</div><h1>${h.positive?'The City <em>Improves.</em>':'A Difficult <em>Trade-off.</em>'}</h1><p>${h.positive?'Your response has unlocked a new stage of city development.':'Your decisions have consequences. The city needs stronger environmental and social protection to grow.'}</p></div>${cityPanel()}<div class="grid"><section class="panel"><div class="eyebrow">DECISION REVIEW</div><h2 class="sectiontitle">What happened?</h2>${h.chosen.map(o=>`<div class="feedback"><b>${o.text}</b><p class="desc">${o.why}</p></div>`).join('')}</section><section class="panel"><div class="eyebrow">MEASURED IMPACT · SIMULATION</div><h2 class="sectiontitle">Your results</h2><div class="impact"><div><small>Environment</small><strong>${h.env>0?'+':''}${h.env}</strong></div><div><small>Economy</small><strong>${h.eco>0?'+':''}${h.eco}</strong></div><div><small>Society</small><strong>${h.soc>0?'+':''}${h.soc}</strong></div></div><p class="desc" style="margin-top:20px">Crisis spending: <b>${money(h.cost)}</b><br>Remaining crisis budget: <b>${money(1000-h.cost)}</b></p><button class="btn" id="next">${state.step<6?'NEXT ENVIRONMENTAL CRISIS →':'VIEW FINAL CITY →'}</button></section></div>`;document.getElementById('next').onclick=render}
function finish(){app.innerHTML=`<div class="hero"><div class="eyebrow">FINAL SUSTAINABILITY REPORT</div><h1>${stage()>=5?'A Greener <em>Tomorrow.</em>':'Your City. <em>Your Legacy.</em>'}</h1><p>Your city reached ${stage()} of 6 sustainability milestones. Replay to discover how different decisions change its future.</p></div>${cityPanel()}${stats()}<section class="panel"><div class="eyebrow">CITY REPORT</div><h2 class="sectiontitle">Mission outcomes</h2>${state.history.map((h,i)=>`<div class="feedback"><b>${String(i+1).padStart(2,'0')} · ${h.title}</b><div class="mini">${h.positive?'✓ City improved':'— No city upgrade'} · ${money(h.cost)} spent · Environmental impact ${h.env>=0?'+':''}${h.env}</div></div>`).join('')}<div class="actions"><button class="btn" id="again">PLAY AGAIN ↻</button><button class="btn secondary" id="print">PRINT RESULTS</button></div></section>`;document.getElementById('again').onclick=()=>{if(confirm('Restart and clear your saved progress?'))reset()};document.getElementById('print').onclick=()=>window.print()}
if(state.step>=0&&state.step<6&&state.history.length===state.step&&state.step>0)result();else render();
</script></body></html>
